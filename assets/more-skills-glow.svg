<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 36" role="img" aria-labelledby="title">
  <title id="title">More skills and experience</title>
  <defs>
    <filter id="glow" x="-.1" y="-.5" width="1.2" height="2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>
  <g class="pulse" filter="url(#glow)" font-family="Segoe UI,Arial,sans-serif">
    <text x="3" y="23" fill="#38bdf8" font-size="15" font-weight="700">More skills &amp; experience</text>
    <text x="205" y="23" fill="#818cf8" font-size="13">— CMS, data, tools, and additional languages</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="3" y="23" fill="#a5f3fc" stroke="#164e63" stroke-width="1.5" paint-order="stroke" font-size="15" font-weight="700">More skills &amp; experience</text>
    <text x="205" y="23" fill="#c7d2fe" stroke="#3730a3" stroke-width="1" paint-order="stroke" font-size="13">— CMS, data, tools, and additional languages</text>
  </g>
</svg>
