<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title description">
  <title id="title">Pronoy Saha, Front-End Developer</title>
  <desc id="description">Front-end developer building responsive web interfaces with React, TypeScript, and Next.js.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#171b3d"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
    <style>
      .glow{animation:glow 6s ease-in-out infinite}
      .float{animation:float 5s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2,start) infinite}
      @keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes blink{to{opacity:0}}
      @media (prefers-reduced-motion:reduce){.glow,.float,.blink{animation:none}}
    </style>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#background)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <circle cx="805" cy="145" r="245" fill="url(#ambient)" class="glow"/>
  <path d="M0 235C190 202 303 280 475 239s306-54 525-5v46H0z" fill="#060d1b" opacity=".58"/>
  <g fill="none" stroke="url(#highlight)" stroke-opacity=".24" stroke-width="1.5">
    <path d="M586 52h58l24 24h62"/>
    <path d="M612 208h67l22-22h77"/>
    <path d="M735 76v38m-34 70v24"/>
    <path d="M838 55h62v37"/>
  </g>
  <g fill="#a5f3fc" class="glow">
    <circle cx="586" cy="52" r="3"/><circle cx="730" cy="76" r="3"/>
    <circle cx="900" cy="92" r="3"/><circle cx="778" cy="186" r="3"/>
    <circle cx="612" cy="208" r="3"/>
  </g>
  <text x="54" y="58" fill="#a5f3fc" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">PRONOY SAHA</text>
  <text x="52" y="112" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="750">Front-End Developer</text>
  <text x="54" y="146" fill="url(#highlight)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">I build responsive, polished web experiences.</text>
  <text x="54" y="182" fill="#b8c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="14">React  ·  TypeScript  ·  Next.js  ·  Tailwind CSS</text>
  <g font-family="Consolas,monospace" font-size="12">
    <rect x="602" y="45" width="340" height="178" rx="13" fill="#080f1c" stroke="#33466a"/>
    <path d="M602 78h340" stroke="#33466a"/>
    <circle cx="622" cy="62" r="4" fill="#fb7185"/><circle cx="637" cy="62" r="4" fill="#fbbf24"/><circle cx="652" cy="62" r="4" fill="#34d399"/>
    <text x="675" y="66" fill="#8191aa" font-size="10">responsive-ui.tsx</text>
    <text x="625" y="105" fill="#c4b5fd">function</text>
    <text x="686" y="105" fill="#7dd3fc">Portfolio</text>
    <text x="747" y="105" fill="#e2e8f0">() {</text>
    <text x="643" y="130" fill="#94a3b8">return</text>
    <text x="683" y="130" fill="#f9a8d4">&lt;ResponsiveDesign</text>
    <text x="684" y="153" fill="#86efac">builtWith</text>
    <text x="747" y="153" fill="#e2e8f0">=</text>
    <text x="756" y="153" fill="#fcd34d">"React + TypeScript"</text>
    <text x="683" y="176" fill="#f9a8d4">/&gt;</text>
    <text x="625" y="200" fill="#e2e8f0">}</text>
    <rect x="667" y="93" width="2" height="16" fill="#67e8f9" class="blink"/>
  </g>
</svg>
